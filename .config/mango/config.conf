# MANGO CONFIGURATION

# Autostart
exec-once = noctalia

#---------------------------------------------------------------------------
# https://mangowm.github.io/docs/configuration/monitors
monitorrule = name:eDP-1, width:1920, height:1080, refresh:144, x:0, y:0, vrr:0, scale:1

#---------------------------------------------------------------------------
# Layout choices: tile, scroller, grid, deck, monocle, center_tile, vertical_tile, vertical_scroller
tagrule = id:1, layout_name:tile
tagrule = id:2, layout_name:tile
tagrule = id:3, layout_name:tile
tagrule = id:4, layout_name:tile
tagrule = id:5, layout_name:tile
tagrule = id:6, layout_name:tile
tagrule = id:7, layout_name:tile
tagrule = id:8, layout_name:tile
tagrule = id:9, layout_name:tile

#---------------------------------------------------------------------------
# https://mangowm.github.io/docs/configuration/basics#environment-variables

env = XDG_CURRENT_DESKTOP,mango
env = XDG_SESSION_TYPE,wayland
# env = LIBVA_DRIVER_NAME,nvidia
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = GBM_BACKEND,nvidia-drm
# env = WLR_NO_HARDWARE_CURSORS,1
# env = QT_QPA_PLATFORMTHEME,qt6ct
# env = QT_QPA_PLATFORMTHEME_QT6,qt6ct

#---------------------------------------------------------------------------
# https://mangowm.github.io/docs/configuration/input

# xkb_rules_layout = us
# accel_profile = 1
# accel_speed = 0.2

#---------------------------------------------------------------------------
# https://mangowm.github.io/docs/window-management/layouts

# Scroller layout settings
scroller_structs = 40
scroller_default_proportion = 0.5
scroller_focus_center = 0
scroller_prefer_center = 0
scroller_prefer_overspread = 1
edge_scroller_pointer_focus = 1
scroller_default_proportion_single = 2.0
scroller_proportion_preset = 0.5, 0.8, 1.0

# Master-Stack layout settings
new_is_master = 1
default_mfact = 0.55
default_nmaster = 1
smartgaps = 0

circle_layout = tile,scroller

#---------------------------------------------------------------------------
# Docs: https://mangowm.github.io/docs/configuration/miscellaneous

allow_tearing = 2
drag_tile_to_tile = 1
# syncobj_enable = 1
# xwayland-persistence = 1

#---------------------------------------------------------------------------
# Look & Feel : https://mangowm.github.io/docs/visuals
# Window Gaps & Borders
gappih = 8
gappiv = 8
gappoh = 8
gappov = 8
borderpx = 1
border_radius = 1

# Scratchpad Dimensions
scratchpad_width_ratio = 0.8
scratchpad_height_ratio = 0.9

# Colors
rootcolor = 0x201b14ff
bordercolor = 0x444444ff
focuscolor = 0x47add6ff
maximizescreencolor = 0x47add6ff
urgentcolor = 0xad401fff
scratchpadcolor = 0x516c93aa
globalcolor = 0xb153a7ff
overlaycolor = 0x14a57cff

# Cursor
cursor_theme = capitaine-cursors
cursor_size = 24

# Blur
blur = 1
blur_layer = 1
blur_optimized = 1
blur_params_num_passes = 2
blur_params_radius = 4
blur_params_noise = 0.04
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

# Shadows
shadows = 0
layer_shadows = 1
shadow_only_floating = 0
shadows_size = 10
shadows_blur = 5
shadows_position_x = 0
shadows_position_y = 0
shadowscolor = 0x000000ff

# Animations
animations = 1
layer_animations = 1
animation_type_open = zoom
animation_type_close = zoom
animation_fade_in = 1
animation_fade_out = 1
tag_animation_direction = 1
zoom_initial_ratio = 0.1
zoom_end_ratio = 0.5
fadein_begin_opacity = 0.3
fadeout_begin_opacity = 0.2
animation_duration_move = 300
animation_duration_open = 100
animation_duration_tag = 300
animation_duration_close = 400
animation_duration_focus = 0
animation_curve_open = 0.87, 0, 0.13, 1
animation_curve_move = 0.46, 1.0, 0.29, 1
animation_curve_tag = 0.46, 1.0, 0.29, 1
animation_curve_close = 0.87, 0, 0.13, 1
animation_curve_focus = 0.46, 1.0, 0.29, 1
animation_curve_opafadeout = 0.5, 0.5, 0.5, 0.5
animation_curve_opafadein = 0.46, 1.0, 0.29, 1

#---------------------------------------------------------------------------
# Keybindings: https://mangowm.github.io/docs/configuration/keybindings

# System & General
bind = SUPER, r, reload_config
bind = SUPER, q, killclient,

# Applications
bind = SUPER, Return, spawn, foot
bind = SUPER, e, spawn, nautilus
bind = SUPER, w, spawn, helium-browser
bind = SUPER, t, spawn, foot -e nvim

# Desktop Shell (Noctalia / DMS)
bind = SUPER, Space, spawn, noctalia msg panel-toggle launcher
bind = SUPER, Z, spawn, noctalia msg settings-toggle
bind = SUPER, X, spawn, noctalia msg panel-toggle control-center
bind = SUPER, V, spawn, noctalia msg panel-toggle clipboard
bind = SUPER+SHIFT, W, spawn, noctalia msg panel-toggle wallpaper
bind = SUPER, A, spawn, noctalia msg panel-toggle control-center notifications
bind = SUPER, L, spawn, noctalia msg session lock
bind = SUPER, Escape, spawn, noctalia msg panel-toggle session
bind = SUPER, Tab, spawn, noctalia msg window-switcher

# Window Focus & Navigation
# bind = SUPER, Tab, focusstack, next
bind = SUPER, Left, focusdir, left
bind = SUPER, Right, focusdir, right
bind = SUPER, Up, focusdir, up
bind = SUPER, Down, focusdir, down

# Window Movement & Resizing (Tiling / Exchange)
bind = SUPER+SHIFT, Up, exchange_client, up
bind = SUPER+SHIFT, Down, exchange_client, down
bind = SUPER+SHIFT, Left, exchange_client, left
bind = SUPER+SHIFT, Right, exchange_client, right

# Floating Window Movement & Resizing
bind = CTRL+SHIFT, Up, movewin, +0, -50
bind = CTRL+SHIFT, Down, movewin, +0, +50
bind = CTRL+SHIFT, Left, movewin, -50, +0
bind = CTRL+SHIFT, Right, movewin, +50, +0

bind = CTRL+ALT, Up, resizewin, +0, -50
bind = CTRL+ALT, Down, resizewin, +0, +50
bind = CTRL+ALT, Left, resizewin, -50, +0
bind = CTRL+ALT, Right, resizewin, +50, +0

# Window States & Toggle Actions
bind = SUPER, g, toggleglobal,
bind = ALT, Tab, toggleoverview,
bind = SUPER, c, togglefloating,
bind = SUPER, f, togglemaximizescreen,
bind = SUPER+SHIFT, f, togglefullscreen,
bind = SUPER+ALT, f, togglefakefullscreen,
bind = SUPER, o, toggleoverlay,
bind = SUPER, i, minimized,
bind = SUPER+SHIFT, I, restore_minimized,
bind = SUPER, S, toggle_scratchpad

# Layout Switching & Controls
bind = SUPER+CTRL, L, switch_layout
bind = SUPER, n, switch_layout
bind = SUPER+SHIFT, e, set_proportion, 1.0
# bind = SUPER, x, switch_proportion_preset,

# Workspace (Tag) Navigation
bind = SUPER, 1, view, 1, 0
bind = SUPER, 2, view, 2, 0
bind = SUPER, 3, view, 3, 0
bind = SUPER, 4, view, 4, 0
bind = SUPER, 5, view, 5, 0
bind = SUPER, 6, view, 6, 0
bind = SUPER, 7, view, 7, 0
bind = SUPER, 8, view, 8, 0
bind = SUPER, 9, view, 9, 0

# Move window to workspace
# bind = SUPER+SHIFT, 1, tagsilent, 1
bind = SUPER+SHIFT, 1, tag, 1, 0
bind = SUPER+SHIFT, 2, tag, 2, 0
bind = SUPER+SHIFT, 3, tag, 3, 0
bind = SUPER+SHIFT, 4, tag, 4, 0
bind = SUPER+SHIFT, 5, tag, 5, 0
bind = SUPER+SHIFT, 6, tag, 6, 0
bind = SUPER+SHIFT, 7, tag, 7, 0
bind = SUPER+SHIFT, 8, tag, 8, 0
bind = SUPER+SHIFT, 9, tag, 9, 0

# Monitor Navigation
bind = SUPER+ALT, Left, focusmon, left
bind = SUPER+ALT, Right, focusmon, right
bind = SUPER+SHIFT+ALT, Left, tagmon, left
bind = SUPER+SHIFT+ALT, Right, tagmon, right

# Gaps Control
bind = SUPER+SHIFT, X, incgaps, 1
bind = SUPER+SHIFT, Z, incgaps, -1
bind = SUPER+SHIFT, R, togglegaps

# Screenshots
bind = NONE, Print, spawn, noctalia msg screenshot-region
bind = SUPER, Print, spawn, noctalia msg screenshot-fullscreen
bind = SUPER, P, spawn, noctalia msg screenshot-region
bind = ALT, Print, spawn, sh -c 'grim -T "$(mmsg get focusing-client | jq -r ".foreign_toplevel_id")" - | wl-copy'
bind = SUPER+SHIFT, t, spawn, sh -c 'grim -g "$(slurp)" - | tesseract stdin stdout | wl-copy'

# Audio & Media Controls
bind = NONE, XF86AudioRaiseVolume, spawn, noctalia msg volume-up
bind = NONE, XF86AudioLowerVolume, spawn, noctalia msg volume-down
bind = NONE, XF86AudioMute, spawn, noctalia msg volume-mute
bind = NONE, XF86AudioMicMute, spawn, noctalia msg mic-mute

bind = NONE, XF86AudioPlay, spawn, noctalia msg media toggle
bind = NONE, XF86AudioPause, spawn, noctalia msg media toggle
bind = NONE, XF86AudioNext, spawn, noctalia msg media next
bind = NONE, XF86AudioPrev, spawn, noctalia msg media previous

# Display Brightness Controls
bind = NONE, XF86MonBrightnessUp, spawn, dms ipc call brightness increment 5
bind = NONE, XF86MonBrightnessDown, spawn, dms ipc call brightness decrement 5

# Mouse Bindings
mousebind = SUPER, btn_left, moveresize, curmove
mousebind = SUPER, btn_right, moveresize, curresize
# mousebind = NONE, btn_middle, togglemaximizescreen, 0

#---------------------------------------------------------------------------
# Rules (Window & Layer)
# Docs: https://mangowm.github.io/docs/window-management/rules
#---------------------------------------------------------------------------
# Floating Window Rules
windowrule = isfloating:1, appid:^(org.gnome.Nautilus|org.kde.dolphin|org.gnome.Calculator|pkg-installer|mpv|org.satty.satty)$
windowrule = isfloating:1, title:^(sh|pkg installer)$
windowrule = isfloating:1, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = isfloating:1, appid:^(dev\.)?noctalia\.Noctalia(\.Settings)?$
windowrule = isnamedscratchpad:1, width:1280, height:800, appid:foot-scratch

# Layer Rules
layerrule = noanim:1, noblur:1, layer_name:selection
