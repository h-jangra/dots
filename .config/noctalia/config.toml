# .local/state/noctalia/settings.toml
config_version = 13

[accessibility]
ui_scale = 1.2

[bar.default]
background_opacity = 0.22
capsule = true
capsule_group = []
capsule_radius = 4
center = [ "workspaces" ]
concave_edge_corners = false
end = [ "tray", "bluetooth", "network", "volume", "battery", "session" ]
margin_ends = 0
radius = 0
scale = 1.1
shadow = false
start = [ "clock", "sysmon_3", "widget", "widget_2" ]
thickness = 30

[control_center.calendar]
show_events_card = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 800.0
    cy = 672.5
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 4
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."h-jangra/keyviz"]
badge_style = "accent"
display_mode = "overlay"
enabled_by_default = false
margin_horizontal = 10
max_keys = 3
overlay_height = 32
overlay_position = "bottom_left"
overlay_width = 160

[plugins]
enabled = [ "alexander/screen-toolkit", "omarchy/aur", "h-jangra/keyviz" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/hj/Projects/noctalia-plugins"
    name = "my-plugins"

[shell]
clipboard_image_action_command = "satty -f -"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    app_grid = true
    categories = false

    [shell.panel]
    borders = false
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screen_corners]
    size = 2

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
builtin = "Nord"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty" ]

[wallpaper.default]
path = "/home/hj/Pictures/Wallpapers/wallhaven-d8orko.png"

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.clock]
color = "secondary"
format = "{:%a %-I:%M %p}"
tooltip_format = "{:%A · %B %d, %Y}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "secondary"

[widget.notifications]
color = "secondary"

[widget.session]
color = "error"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"
visualization = "none"

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.volume]
color = "secondary"

[widget.widget]
type = "alexander/screen-toolkit:widget"

[widget.widget_2]
type = "h-jangra/keyviz:widget"

[widget.workspaces]
capsule = true
capsule_fill = "on_primary"
inactive_pill_size = 1.0
pill_scale = 0.80000000000000004
show_labels = false

