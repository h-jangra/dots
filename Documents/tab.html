<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Tab</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #f5f5f3;
  --text: #181818;
  --muted: #777;
  --card: #fff;
  --border: #e7e7e3;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212;
    --text: #eee;
    --muted: #888;
    --card: #1b1b1b;
    --border: #292929;
  }
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, sans-serif;
  display: grid;
  place-items: center;
}

main {
  width: min(680px, calc(100% - 40px));
  margin-top: -7vh;
}

.time {
  font-size: clamp(4rem, 12vw, 7rem);
  font-weight: 700;
  letter-spacing: -.07em;
  line-height: 1;
}

.date {
  margin-top: 12px;
  color: var(--muted);
}

form {
  margin-top: 42px;
}

input {
  width: 100%;
  padding: 17px 20px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font: inherit;
  outline: none;
}

input:focus {
  border-color: var(--text);
}

.shortcuts {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 18px;
}

.shortcut {
  min-width: 0;
}

.shortcut a,
.add {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 48px;
  padding: 10px;
  border-radius: 10px;
  color: var(--muted);
  text-decoration: none;
  font-size: 14px;
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  width: 100%;
  transition: .15s;
}

.shortcut a:hover,
.add:hover {
  background: var(--card);
  border-color: var(--border);
  color: var(--text);
}

.shortcut span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.menu {
  position: fixed;
  display: none;
  width: 130px;
  padding: 5px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 10px 30px #0002;
  z-index: 10;
}

.menu.show {
  display: block;
}

.menu button {
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--text);
  text-align: left;
  padding: 9px 10px;
  border-radius: 6px;
  cursor: pointer;
  font: inherit;
  font-size: 13px;
}

.menu button:hover {
  background: var(--bg);
}

.menu .delete:hover {
  color: #d44;
}

dialog {
  width: min(360px, calc(100% - 30px));
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--card);
  color: var(--text);
  padding: 22px;
}

dialog::backdrop {
  background: #0008;
}

dialog h3 {
  margin: 0 0 16px;
}

dialog input {
  margin-top: 10px;
  padding: 12px;
  border-radius: 9px;
}

.actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}

.actions button {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  padding: 9px 14px;
  border-radius: 8px;
  cursor: pointer;
  font: inherit;
}

.actions button:hover {
  background: var(--bg);
}

.hint {
  margin-top: 28px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  opacity: .65;
}
</style>
</head>

<body>

<main>
  <div class="time" id="time"></div>
  <div class="date" id="date"></div>

  <form action="https://www.google.com/search">
    <input
      name="q"
      autofocus
      autocomplete="off"
      placeholder="Search the web..."
    >
  </form>

  <div class="shortcuts" id="shortcuts"></div>

  <div class="hint">Ctrl K to search · Right click a shortcut to edit</div>
</main>

<div class="menu" id="menu">
  <button id="editShortcut">Edit</button>
  <button class="delete" id="deleteShortcut">Delete</button>
</div>

<dialog id="dialog">
  <h3 id="dialogTitle">Add shortcut</h3>

  <input id="name" placeholder="Name">
  <input id="url" placeholder="URL">

  <div class="actions">
    <button id="cancel" type="button">Cancel</button>
    <button id="save" type="button">Save</button>
  </div>
</dialog>

<script>
const defaults = [
  ["GitHub", "https://github.com"],
  ["YouTube", "https://youtube.com"],
  ["Mail", "https://mail.google.com"],
  ["ChatGPT", "https://chatgpt.com"]
];

let shortcuts = JSON.parse(localStorage.getItem("shortcuts")) || defaults;
let editing = null;
let selected = null;

const time = document.getElementById("time");
const date = document.getElementById("date");
const list = document.getElementById("shortcuts");
const dialog = document.getElementById("dialog");
const menu = document.getElementById("menu");
const nameInput = document.getElementById("name");
const urlInput = document.getElementById("url");
const dialogTitle = document.getElementById("dialogTitle");

function saveShortcuts() {
  localStorage.setItem("shortcuts", JSON.stringify(shortcuts));
  render();
}

function render() {
  list.innerHTML = "";

  shortcuts.forEach(([name, url], index) => {
    const item = document.createElement("div");
    item.className = "shortcut";

    const link = document.createElement("a");
    link.href = url;

    const text = document.createElement("span");
    text.textContent = name;

    link.appendChild(text);
    item.appendChild(link);

    item.addEventListener("contextmenu", e => {
      e.preventDefault();

      selected = index;

      const x = Math.min(e.clientX, innerWidth - 140);
      const y = Math.min(e.clientY, innerHeight - 100);

      menu.style.left = `${x}px`;
      menu.style.top = `${y}px`;
      menu.classList.add("show");
    });

    list.appendChild(item);
  });

  const add = document.createElement("button");
  add.className = "add";
  add.textContent = "+";

  add.onclick = () => {
    editing = null;
    nameInput.value = "";
    urlInput.value = "";
    dialogTitle.textContent = "Add shortcut";
    dialog.showModal();
    nameInput.focus();
  };

  list.appendChild(add);
}

document.getElementById("editShortcut").onclick = () => {
  if (selected === null) return;

  editing = selected;
  nameInput.value = shortcuts[selected][0];
  urlInput.value = shortcuts[selected][1];
  dialogTitle.textContent = "Edit shortcut";

  menu.classList.remove("show");
  dialog.showModal();
  nameInput.focus();
};

document.getElementById("deleteShortcut").onclick = () => {
  if (selected === null) return;

  shortcuts.splice(selected, 1);
  selected = null;

  menu.classList.remove("show");
  saveShortcuts();
};

document.getElementById("save").onclick = () => {
  const name = nameInput.value.trim();
  let url = urlInput.value.trim();

  if (!name || !url) return;

  if (!/^https?:\/\//i.test(url)) {
    url = "https://" + url;
  }

  if (editing === null) {
    shortcuts.push([name, url]);
  } else {
    shortcuts[editing] = [name, url];
  }

  dialog.close();
  saveShortcuts();
};

document.getElementById("cancel").onclick = () => dialog.close();

document.addEventListener("click", e => {
  if (!menu.contains(e.target)) {
    menu.classList.remove("show");
  }
});

addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    document.querySelector("form input").focus();
  }
});

function updateTime() {
  const now = new Date();

  time.textContent = now.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });

  date.textContent = now.toLocaleDateString([], {
    weekday: "long",
    day: "numeric",
    month: "long"
  });
}

updateTime();
setInterval(updateTime, 1000);

render();
</script>

</body>
</html>
